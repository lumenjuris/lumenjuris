<!doctype html>
<html lang="fr" data-framework="typescript">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lumen Juris — Assistant Contrats</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <style>
        :root {
            --lj-blue: #0D6EFD;
            --lj-navy: #0A2540;
            --lj-bg: #f6f8fb;
            --lj-line: #e2e8f0;
            --lj-red: #dc2626;
            --lj-amber: #d97706;
            --lj-green: #16a34a;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 13px;
            color: var(--lj-navy);
            background: var(--lj-bg);
        }

        .lj-header {
            background: #ffffff;
            border-bottom: 1px solid var(--lj-line);
            padding: 12px 14px 10px;
        }
        .lj-header .lj-subtitle {
            margin-top: 2px;
            color: #64748b;
            font-size: 12px;
        }

        .lj-tabs {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid var(--lj-line);
        }
        .lj-tab {
            flex: 1;
            border: none;
            background: none;
            padding: 9px 4px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .lj-tab.active {
            color: var(--lj-blue);
            border-bottom-color: var(--lj-blue);
        }

        .lj-content { padding: 6px 14px 24px; }

        .lj-card {
            background: #ffffff;
            border: 1px solid var(--lj-line);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .lj-card h3 {
            margin: 0 0 6px;
            font-size: 13px;
        }
        .lj-muted { color: #64748b; font-size: 12px; }

        .lj-stats {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .lj-stat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: var(--lj-bg);
            border: 1px solid var(--lj-line);
            border-radius: 6px;
            padding: 6px 4px;
        }
        .lj-stat-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--lj-navy);
        }
        .lj-stat-label {
            font-size: 10.5px;
            color: #64748b;
            text-align: center;
            line-height: 1.2;
        }

        .lj-btn {
            display: inline-block;
            border: none;
            border-radius: 6px;
            background: var(--lj-blue);
            color: #ffffff;
            font-weight: 600;
            font-size: 12.5px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .lj-btn:hover { background: #0b5ed7; }
        .lj-btn:disabled { background: #93b8f5; cursor: default; }
        .lj-btn.secondary {
            background: #ffffff;
            color: var(--lj-navy);
            border: 1px solid #cbd5e1;
        }
        .lj-btn.secondary:hover { background: #f1f5f9; }
        .lj-btn.small { padding: 5px 9px; font-size: 12px; }

        .lj-status {
            margin: 8px 0 0;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .lj-status.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .lj-status.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
        .lj-status.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .lj-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }
        .lj-badge.high { background: #fee2e2; color: var(--lj-red); }
        .lj-badge.medium { background: #fef3c7; color: var(--lj-amber); }
        .lj-badge.low { background: #dcfce7; color: var(--lj-green); }

        .lj-count-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .lj-count-badge.high { background: #fee2e2; color: var(--lj-red); }
        .lj-count-badge.medium { background: #fef3c7; color: var(--lj-amber); }
        .lj-count-badge.low { background: #dcfce7; color: var(--lj-green); }

        .lj-clause-text {
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
            background: #f8fafc;
            border: 1px solid var(--lj-line);
            border-radius: 6px;
            padding: 8px;
            margin: 8px 0;
            max-height: 160px;
            overflow-y: auto;
        }

        .lj-list { margin: 6px 0 0; padding-left: 18px; }
        .lj-list li { margin-bottom: 5px; line-height: 1.45; }

        .lj-section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 12.5px;
            margin: 12px 0 4px;
        }

        a { color: var(--lj-blue); }

        .lj-input, .lj-textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 7px 9px;
            font-size: 12.5px;
            font-family: inherit;
            color: var(--lj-navy);
            margin-bottom: 8px;
            background: #ffffff;
        }
        .lj-input:focus, .lj-textarea:focus { outline: 2px solid #bfdbfe; border-color: var(--lj-blue); }

        .lj-label {
            display: block;
            font-weight: 600;
            font-size: 12px;
            margin: 6px 0 3px;
        }

        .lj-clickable { cursor: pointer; }
        .lj-clickable:hover { border-color: var(--lj-blue); box-shadow: 0 1px 4px rgba(13, 110, 253, 0.15); }

        .lj-radio {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            margin: 4px 0;
            font-size: 12.5px;
            cursor: pointer;
            line-height: 1.4;
        }
        .lj-radio input { margin-top: 2px; }

        /* ================================================================
           Charte Lumen Juris (alignée sur front/tailwind.config.js) :
           bleu marine #2C3A5E, fond #f4f6fa, rayons 12/16 px, Inter.
           Utilisée par l'écran de connexion et le menu.
           ================================================================ */
        :root {
            --lj-brand: #2C3A5E;
            --lj-brand-dark: #1a2238;
            --lj-brand-bg: #f4f6fa;
            --lj-brand-ring: 0 0 0 3px rgba(53, 79, 153, 0.15);
            --lj-shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
            --lj-font: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        /* ---- Écran de connexion ---- */
        .lj-auth { font-family: var(--lj-font); padding-top: 12px; }
        .lj-auth-hero { text-align: center; margin: 4px 0 14px; }
        .lj-auth-hero img { width: 44px; height: 44px; border-radius: 12px; box-shadow: var(--lj-shadow-card); }
        .lj-auth-hero h2 { margin: 10px 0 2px; font-size: 16px; font-weight: 700; color: var(--lj-brand); letter-spacing: -0.01em; }
        .lj-auth-hero p { margin: 0; font-size: 12px; color: #64748b; }

        .lj-auth-card {
            background: #ffffff;
            border: 1px solid var(--lj-line);
            border-radius: 16px;
            box-shadow: var(--lj-shadow-card);
            padding: 16px;
            margin-bottom: 12px;
        }
        .lj-auth-card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--lj-brand); }
        .lj-auth-card .lj-input { border-radius: 8px; padding: 8px 10px; }
        .lj-auth-card .lj-input:focus { outline: none; border-color: var(--lj-brand); box-shadow: var(--lj-brand-ring); }

        .lj-sso { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .lj-sso-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; height: 38px;
            border: 1px solid var(--lj-brand);
            border-radius: 8px;
            background: #ffffff;
            color: var(--lj-brand);
            font: 500 12.5px var(--lj-font);
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .lj-sso-btn:hover:not(:disabled) { background: var(--lj-brand-bg); }
        .lj-sso-btn:disabled { opacity: 0.6; cursor: default; }
        .lj-sso-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .lj-divider {
            display: flex; align-items: center; gap: 10px;
            margin: 14px 0 6px;
            color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
        }
        .lj-divider::before, .lj-divider::after { content: ""; flex: 1; height: 1px; background: var(--lj-line); }

        .lj-btn-brand {
            width: 100%; height: 38px; margin-top: 6px;
            border: none; border-radius: 8px;
            background: var(--lj-brand); color: #ffffff;
            font: 600 12.5px var(--lj-font);
            cursor: pointer;
            transition: box-shadow 0.15s ease, background 0.15s ease;
        }
        .lj-btn-brand:hover:not(:disabled) { box-shadow: inset 0 -3px 0 0 rgba(0, 0, 0, 0.15); }
        .lj-btn-brand:disabled { background: #8a94ab; cursor: default; }

        .lj-auth-links { text-align: center; margin: 12px 0 0; font-size: 12px; color: #64748b; }
        .lj-auth-links a { color: var(--lj-brand); font-weight: 600; text-decoration: none; }
        .lj-auth-links a:hover { text-decoration: underline; }
        .lj-auth-features { list-style: none; margin: 0; padding: 0; }
        .lj-auth-features li { position: relative; padding-left: 18px; margin-bottom: 6px; font-size: 12px; line-height: 1.45; color: #475569; }
        .lj-auth-features li::before { content: "✓"; position: absolute; left: 0; color: var(--lj-brand); font-weight: 700; }

        /* ---- Menu ---- */
        .lj-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 10px; font-family: var(--lj-font); }
        .lj-topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: var(--lj-brand); }
        .lj-topbar-brand img { width: 22px; height: 22px; border-radius: 6px; }
        .lj-logout {
            border: none; background: none; padding: 4px 6px; border-radius: 6px;
            color: #64748b; font: 500 11.5px var(--lj-font); cursor: pointer;
        }
        .lj-logout:hover { background: #eef1f6; color: var(--lj-brand); }

        /* Onglets (une vue est ouverte) */
        .lj-menu-tabs {
            display: flex; gap: 4px; padding: 4px; margin-bottom: 12px;
            background: #e9edf4; border-radius: 12px; font-family: var(--lj-font);
        }
        .lj-menu-tab {
            flex: 1; border: none; background: none; padding: 7px 6px; border-radius: 9px;
            color: #64748b; font: 600 12px var(--lj-font); cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .lj-menu-tab:hover { color: var(--lj-brand); }
        .lj-menu-tab.active { background: #ffffff; color: var(--lj-brand); box-shadow: var(--lj-shadow-card); }

        /* Tuiles (accueil, aucune vue ouverte) */
        .lj-menu-tiles { display: flex; flex-direction: column; gap: 10px; font-family: var(--lj-font); }
        .lj-menu-tile {
            display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
            background: #ffffff; border: 1px solid var(--lj-line); border-radius: 16px;
            box-shadow: var(--lj-shadow-card); padding: 14px; cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            font-family: var(--lj-font);
        }
        .lj-menu-tile:hover { border-color: var(--lj-brand); box-shadow: var(--lj-brand-ring); }
        .lj-menu-tile-icon {
            flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: var(--lj-brand-bg); color: var(--lj-brand); font-size: 16px;
        }
        .lj-menu-tile strong { display: block; font-size: 13px; color: var(--lj-brand); margin-bottom: 2px; }
        .lj-menu-tile span { font-size: 12px; color: #64748b; line-height: 1.4; }
        .lj-logout.lj-topbar-brand { color: var(--lj-brand); font-weight: 700; font-size: 13px; padding: 4px; }

        /* ---- Génération de contrat ---- */
        .lj-gen-kicker { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; }
        .lj-progress { height: 4px; background: #e9edf4; border-radius: 999px; overflow: hidden; }
        .lj-progress > div { height: 100%; background: var(--lj-brand); border-radius: 999px; transition: width 0.2s ease; }
        .lj-choice {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            width: 100%; margin-bottom: 8px; padding: 10px 12px; text-align: left;
            background: #ffffff; border: 1px solid var(--lj-line); border-radius: 12px;
            color: var(--lj-brand); font: 500 12.5px var(--lj-font); cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .lj-choice:hover:not(:disabled), .lj-choice.selected { border-color: var(--lj-brand); background: var(--lj-brand-bg); }
        .lj-choice:disabled { opacity: 0.5; cursor: default; }
        .lj-choice strong { display: block; font-size: 12.5px; }
        .lj-choice small { display: block; margin-top: 2px; font-size: 11px; color: #64748b; font-weight: 400; }
        .lj-gen-examples { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
        .lj-gen-examples button {
            border: 1px solid var(--lj-line); background: var(--lj-brand-bg); color: #475569;
            border-radius: 999px; padding: 3px 9px; font: 500 11px var(--lj-font); cursor: pointer;
        }
        .lj-gen-examples button:hover { border-color: var(--lj-brand); color: var(--lj-brand); }
        .lj-gen-check { display: flex; align-items: center; gap: 6px; margin: 0 0 12px; font-size: 12px; color: #475569; cursor: pointer; }
        .lj-gen-nav { display: flex; justify-content: space-between; margin-top: 12px; }
        .lj-gen-group { border: none; padding: 0; margin: 10px 0 0; }
        .lj-gen-group legend { padding: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; }
        .lj-spinner {
            width: 26px; height: 26px; margin: 8px auto 0; border-radius: 50%;
            border: 3px solid #e9edf4; border-top-color: var(--lj-brand);
            animation: lj-spin 0.8s linear infinite;
        }
        @keyframes lj-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div id="container"></div>
</body>

</html>
